[build-system]
requires = ["setuptools>=61.0", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "hmx-lsp"
version = "0.4.0"
description = "High-performance, cross-layer language server for HMX"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hashmicro", email = "dev@hashmicro.com" }
]
dependencies = [
    "pygls>=2.1.1",
    "lsprotocol>=2025.0.0",
    "lxml>=5.0.0",
    "mcp>=1.0.0,<2.0.0",
    "typer",
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=0.2.0",
]

[project.scripts]
hmx-ls = "hmx_ls.cli:main"
hmx-lsp = "hmx_ls.cli:main"
