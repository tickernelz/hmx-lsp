name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.12.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  binary:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            asset: hmx-lsp-windows-x64.exe
          - target: darwin-arm64
            runner: macos-14
            asset: hmx-lsp-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            asset: hmx-lsp-darwin-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: hmx-lsp-linux-arm64
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clone source from HashMicro GitLab
        shell: bash
        run: |
          URL="${{ secrets.GIT_HASHMICRO_URL }}"
          if [ -z "$URL" ]; then
            URL="https://git.hashmicro.com/hashmicro1/hmx/hmx-lsp.git"
          fi
          AUTH_URL=$(echo "$URL" | sed -E "s#https://#https://${{ secrets.GIT_HASHMICRO_USERNAME }}:${{ secrets.GIT_HASHMICRO_PAT }}@#")
          git clone --depth 1 --branch "${{ inputs.tag }}" "$AUTH_URL" src

      - name: Install dependencies
        shell: bash
        run: |
          cd src
          python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile standalone binary
        shell: bash
        run: |
          cd src
          python -m PyInstaller --onefile --noconfirm --clean \
            --name hmx-lsp \
            --paths . \
            --collect-submodules hmx_core \
            --collect-submodules hmx_ls \
            --collect-all pygls \
            --collect-all lsprotocol \
            --collect-all lxml \
            --collect-all mcp \
            hmx_ls/cli.py

      - name: Stage and smoke test
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv src/dist/hmx-lsp.exe "out/${{ matrix.asset }}"
          else
            chmod +x src/dist/hmx-lsp
            mv src/dist/hmx-lsp "out/${{ matrix.asset }}"
          fi
          "./out/${{ matrix.asset }}" --version
          "./out/${{ matrix.asset }}" doctor

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p assets
          find staging -type f -name 'hmx-lsp-*' -exec cp {} assets/ ;
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: HMX-LS ${{ inputs.tag }}
          generate_release_notes: true
          files: assets/*
