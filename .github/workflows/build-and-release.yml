name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.12.0)"
        required: true
        type: string

jobs:
  debug-and-build:
    name: Debug Clone
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Secrets Breakdown
        env:
          HM_USER: ${{ secrets.GIT_HASHMICRO_USERNAME }}
          HM_PAT: ${{ secrets.GIT_HASHMICRO_PAT }}
          HM_URL: ${{ secrets.GIT_HASHMICRO_URL }}
        run: |
          python3 -c "
          import os
          user = os.environ.get('HM_USER', '')
          url = os.environ.get('HM_URL', '')
          # Print safely by breaking up characters so GitHub secret masking doesn't hide it completely
          print('USERNAME separated:', ' '.join(user))
          print('URL separated     :', ' '.join(url))
          "
