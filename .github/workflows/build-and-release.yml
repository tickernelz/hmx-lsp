name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  build:
    name: Build ${{ matrix.platform }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            bin_name: hmx-lsp-linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            bin_name: hmx-lsp-linux-arm64
          - platform: windows-x64
            runner: windows-latest
            bin_name: hmx-lsp-windows-x64.exe
          - platform: macos-x64
            runner: macos-13
            bin_name: hmx-lsp-darwin-x64
          - platform: macos-arm64
            runner: macos-14
            bin_name: hmx-lsp-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -v tests/

      - name: Build standalone binary
        shell: bash
        run: |
          python -m PyInstaller --onefile \
            --name hmx-lsp \
            --paths . \
            --collect-all pygls \
            --collect-all lsprotocol \
            --collect-all lxml \
            --collect-all mcp \
            --collect-all tree_sitter \
            --collect-all tree_sitter_language_pack \
            hmx_ls/cli.py

          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/hmx-lsp.exe dist/${{ matrix.bin_name }}
          else
            chmod +x dist/hmx-lsp
            mv dist/hmx-lsp dist/${{ matrix.bin_name }}
          fi

      - name: Smoke test binary
        shell: bash
        run: |
          ./dist/${{ matrix.bin_name }} setup vscode

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/${{ matrix.bin_name }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          draft: false
          prerelease: false
          files: |
            release_assets/*
