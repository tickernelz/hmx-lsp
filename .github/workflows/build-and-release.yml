name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.12.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  binary:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            asset: hmx-lsp-windows-x64.exe
          - target: darwin-arm64
            runner: macos-14
            asset: hmx-lsp-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            asset: hmx-lsp-darwin-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: hmx-lsp-linux-arm64
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clone source from HashMicro GitLab
        shell: bash
        env:
          HM_USER: ${{ secrets.GIT_HASHMICRO_USERNAME }}
          HM_PAT: ${{ secrets.GIT_HASHMICRO_PAT }}
          HM_URL: ${{ secrets.GIT_HASHMICRO_URL }}
        run: |
          python -c "
          import os, subprocess, urllib.parse, sys
          user = os.environ.get('HM_USER', '').strip() or 'oauth2'
          pat = os.environ.get('HM_PAT', '').strip()
          raw_url = os.environ.get('HM_URL', '').strip() or 'https://git.hashmicro.com/hashmicro1/hmx/hmx-lsp.git'
          clean = raw_url.replace('https://', '').replace('http://', '').strip('/')
          if '/' not in clean:
              host = clean
              repo_path = 'hashmicro1/hmx/hmx-lsp.git'
          else:
              parts = clean.split('/', 1)
              host = parts[0]
              repo_path = parts[1]
              if not repo_path.endswith('.git'):
                  repo_path += '.git'
          user_enc = urllib.parse.quote(user, safe='')
          pat_enc = urllib.parse.quote(pat, safe='')
          auth_url = f'https://{user_enc}:{pat_enc}@{host}/{repo_path}'
          cmd = ['git', 'clone', '--depth', '1', '--branch', '${{ inputs.tag }}', auth_url, 'src']
          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          "

      - name: Install dependencies
        shell: bash
        run: |
          cd src
          python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile standalone binary
        shell: bash
        run: |
          cd src
          python -m PyInstaller --onefile --noconfirm --clean \
            --name hmx-lsp \
            --paths . \
            --collect-submodules hmx_core \
            --collect-submodules hmx_ls \
            --collect-all pygls \
            --collect-all lsprotocol \
            --collect-all lxml \
            --collect-all mcp \
            hmx_ls/cli.py
          mkdir -p ../out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/hmx-lsp.exe "../out/${{ matrix.asset }}"
          else
            chmod +x dist/hmx-lsp
            mv dist/hmx-lsp "../out/${{ matrix.asset }}"
          fi
          "../out/${{ matrix.asset }}" --version
          "../out/${{ matrix.asset }}" doctor

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p assets
          find staging -type f -name 'hmx-lsp-*' -exec cp {} assets/ ;
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: HMX-LS ${{ inputs.tag }}
          generate_release_notes: true
          files: assets/*
