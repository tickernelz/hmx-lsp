name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.12.0)"
        required: true
        type: string

jobs:
  debug-and-build:
    name: Debug Clone
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Secrets and Test Clone
        env:
          HM_USER: ${{ secrets.GIT_HASHMICRO_USERNAME }}
          HM_PAT: ${{ secrets.GIT_HASHMICRO_PAT }}
          HM_URL: ${{ secrets.GIT_HASHMICRO_URL }}
        run: |
          python3 -c "
          import os, urllib.parse, subprocess
          user = os.environ.get('HM_USER', '')
          url = os.environ.get('HM_URL', '')
          pat = os.environ.get('HM_PAT', '')
          print('USERNAME:', repr(user))
          print('URL     :', repr(url))
          print('PAT len :', len(pat))
          print('PAT prefix:', pat[:7] if pat else 'EMPTY')

          # Try testing curl to the API or git ls-remote
          target_url = url or 'https://git.hashmicro.com/hashmicro1/hmx/hmx-lsp.git'
          if not target_url.endswith('.git'): target_url += '.git'
          if not target_url.startswith(('http://', 'https://')): target_url = 'https://' + target_url
          
          # Test with extraHeader
          print('Testing git ls-remote with extraHeader...')
          cmd = ['git', '-c', f'http.extraHeader=PRIVATE-TOKEN: {pat}', 'ls-remote', target_url]
          res = subprocess.run(cmd, capture_output=True, text=True)
          print('Return code:', res.returncode)
          print('Stdout head:', res.stdout[:200])
          print('Stderr head:', res.stderr[:300])

          # Test with basic auth
          print('Testing git ls-remote with basic auth...')
          p = urllib.parse.urlparse(target_url)
          auth_url = f'{p.scheme}://{user}:{pat}@{p.netloc}{p.path}'
          cmd2 = ['git', 'ls-remote', auth_url]
          res2 = subprocess.run(cmd2, capture_output=True, text=True)
          print('Return code 2:', res2.returncode)
          print('Stderr 2:', res2.stderr[:300])
          "
