name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (empty = no release)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q tests/

      - name: Verify CLI surface
        run: |
          python -m hmx_ls.cli --version
          python -m hmx_ls.cli doctor
          python -m hmx_ls.cli setup vscode

  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check every declaration agrees
        run: python scripts/bump_version.py --check

      - name: Check declarations match the release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: python scripts/bump_version.py --check --expect "${RELEASE_TAG#v}"

  binary:
    name: Binary ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            asset: hmx-lsp-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: hmx-lsp-linux-arm64
          - target: windows-x64
            runner: windows-latest
            asset: hmx-lsp-windows-x64.exe
          - target: darwin-x64
            runner: macos-15-intel
            asset: hmx-lsp-darwin-x64
          - target: darwin-arm64
            runner: macos-14
            asset: hmx-lsp-darwin-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile standalone binary
        shell: bash
        run: |
          python -m PyInstaller --onefile --noconfirm --clean \
            --name hmx-lsp \
            --paths . \
            --collect-submodules hmx_core \
            --collect-submodules hmx_ls \
            --collect-all pygls \
            --collect-all lsprotocol \
            --collect-all lxml \
            --collect-all mcp \
            hmx_ls/cli.py

      - name: Stage and smoke test
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/hmx-lsp.exe "out/${{ matrix.asset }}"
          else
            chmod +x dist/hmx-lsp
            mv dist/hmx-lsp "out/${{ matrix.asset }}"
          fi
          "./out/${{ matrix.asset }}" --version
          "./out/${{ matrix.asset }}" doctor
          "./out/${{ matrix.asset }}" setup env

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  extension-vscode:
    name: Extension VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install, compile and package
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx --yes @vscode/vsce package --out hmx-lsp-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: extension-vscode
          path: editors/vscode/hmx-lsp-vscode.vsix
          if-no-files-found: error
          retention-days: 14

  extension-jetbrains:
    name: Extension JetBrains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build plugin
        working-directory: editors/jetbrains
        run: gradle --no-daemon buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: extension-jetbrains
          path: editors/jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  extension-zed:
    name: Extension Zed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed

      - name: Build wasm extension
        working-directory: editors/zed
        run: cargo build --release --target wasm32-wasip1

      - name: Stage extension bundle
        working-directory: editors/zed
        run: |
          mkdir -p out
          cp extension.toml out/
          cp target/wasm32-wasip1/release/hmx_zed.wasm out/extension.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zed
          path: editors/zed/out/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [version-sync, binary, extension-vscode, extension-jetbrains, extension-zed]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p assets
          find staging -type f \( -name 'hmx-lsp-*' -o -name '*.vsix' -o -name '*.zip' \) -exec cp {} assets/ \;
          tar -czf assets/hmx-lsp-zed-extension.tar.gz -C staging/extension-zed .
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: assets/*
